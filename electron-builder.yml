appId: app.tunnely.vpn
productName: Tunnely VPN
copyright: © 2026 Tunnely
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: resources
    to: app-resources
    filter: ["**/*", "!.core-tmp"]
  - from: THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  executableName: Tunnely
  requestedExecutionLevel: asInvoker
nsis:
  # Установка в один клик только для текущего пользователя (%LOCALAPPDATA%\Programs):
  # не нужны права администратора ни при установке, ни при автообновлении
  oneClick: true
  perMachine: false
  allowElevation: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Tunnely VPN
  uninstallDisplayName: Tunnely VPN
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  include: build/installer.nsh
  language: "1049"
  multiLanguageInstaller: false
  deleteAppDataOnUninstall: false
  # Постоянное имя файла — ссылка releases/latest/download/Tunnely-VPN-Setup.exe всегда ведёт на последнюю версию
  artifactName: Tunnely-VPN-Setup.${ext}
# Автообновление: приложения проверяют новые версии в GitHub Releases этого репозитория.
# В релиз нужно загружать три файла из release/: latest.yml, установщик и .blockmap.
publish:
  provider: github
  owner: mihail130799-jpg
  repo: TunnelyVPN
  releaseType: release
